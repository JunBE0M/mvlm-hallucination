seed: 0

coco:
  # val2017/ 와 annotations/ 를 담은 디렉터리. 상대경로는 레포 루트 기준.
  root: .
  ann_file: annotations/instances_val2017.json
  image_dir: val2017

data:
  classes: [cat, dog, horse, elephant, giraffe, zebra, car, bus, train, motorcycle,
            airplane, boat, person, pizza, laptop, tv, toilet, refrigerator, umbrella, teddy bear]
  Ns: [12, 16]
  # (class, N) 셀마다 생성 개수. forall은 쌍 단위(=forall_yes 1 + forall_no 1).
  n_forall_pairs: 10
  n_exists_yes: 10
  n_exists_no: 10
  # 홀로 다른 이미지(forall_no의 absent / exists_yes의 present) 위치:
  #   "uniform"  : 0..N-1 에 균등 배분(셀 안에서 정확히 균등하게 돌리고 섞음)
  #   "fixed:k"  : 항상 k번째 (k<0 이면 뒤에서부터, 예: fixed:-1 = 마지막)
  odd_position: uniform
  # present 이미지의 최대 bbox 면적 비율 필터 [lo, hi] (null이면 필터 없음)
  area_range: null
  templates:
    forall: "Is there a {obj} in all {N} images? Please answer with Yes or No."
    exists: "Is there a {obj} in any of the {N} images? Please answer with Yes or No."

model:
  name: qwen2.5-vl-3b
  attn_impl: sdpa        # E2(attn_probe)는 eager 강제
  dtype: bfloat16
  # 모델·N 간 공정 비교를 위해 이미지 해상도 상한 고정 (448*448)
  max_pixels: 200704
  min_pixels: null       # null = processor 기본값
